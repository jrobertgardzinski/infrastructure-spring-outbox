version: 2

# Weekly, and PATCH updates arrive as ONE grouped pull request so the auto-merge workflow
# has a single thing to decide about. Minor and major updates stay ungrouped and unmerged:
# they change behaviour, and behaviour is a person's call.
#
# Kept to the ecosystems this repository actually carries — see the estate survey of
# 2026-07-29: the pure-domain libraries (slf4j + junit) and the stdlib-only Python services
# have nothing here worth a weekly pull request.
# open-pull-requests-limit was 5 until 2026-07-29 and that number silently cost us a bump:
# microservice-memes had five maven PRs open, so the cucumber 7.20.1 -> 7.34.6 update was
# never proposed at all and the service sat a year behind its sibling until a manual sweep
# found it. A truncated queue looks exactly like an empty one - nothing reports the
# difference - so the limit is 10 now.
updates:
  # pins Spring Framework directly, despite being a small adapter
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      patches:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      # The framework's own MAJOR line is a migration you plan, not a Monday pull request — and
      # leaving it un-ignored costs more than the noise. Dependabot always targets the LATEST
      # version, so while 4.x exists it offers 3.5.3 -> 4.1.0 and NEVER 3.5.3 -> 3.5.16: the
      # thirteen patch releases of the supported line, the ones carrying the security fixes, would
      # simply never be proposed. Ignoring the major is what makes the patch line visible at all.
      # (Found the hard way on 2026-07-29, from Dependabot's first run against this very file.)
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]

  # The workflow pins of this repository (actions/checkout and friends). Added 2026-07-30: nothing
  # watched them, so they sat on majors that were two to three releases behind.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      patches:
        patterns: ["*"]
        update-types: ["patch"]
